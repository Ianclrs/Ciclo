name: CI

# M8 — o repositório não tinha CI: build, testes e lint só rodavam à mão.
# Este workflow é o portão mínimo do PR. O contorno do restore quebrado (L1) é LOCAL desta
# máquina — no runner o NuGet é íntegro, então `dotnet restore` roda normalmente aqui.
#
# Configuração = Debug (padrão) de propósito: é a mesma que os gates locais executam, então
# cada comando abaixo tem prova real nesta máquina. `-c Release` não é validável aqui — o
# mesmo defeito do NuGet reaparece como NETSDK1060 ao reler os assets (L1).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Spec 180 — o SDK vem do global.json versionado, não de uma faixa solta: a versão
      # usada na CI passa a ser a mesma que o build local resolve.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Spec 180 (FR-003) — um teste marcado como ignorado mantém a CI verde sem executar a
      # verificação. A ausência do marcador xUnit é portão do próprio job. O padrão aceita a
      # forma `Skip = "motivo"` do atributo sem casar com nomes de domínio (`Skipped`, `Skips...`).
      - name: Forbid skipped tests
        run: |
          if grep -rnE 'Skip[[:space:]]*=' tests/Ciclo.Api.Tests/; then
            echo "::error::Marcador de execução ignorada (Skip=) encontrado na suíte do backend."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Ciclo.sln

      - name: Build
        run: dotnet build Ciclo.sln --no-restore

      # Spec 180 — a cobertura é medida e julgada pelo próprio `dotnet test` (coverlet.msbuild):
      # abaixo de 60% de linhas o comando sai com código diferente de zero e o job falha.
      # Sem `--no-build`: a instrumentação acontece no build do projeto de teste.
      - name: Test
        run: >-
          dotnet test tests/Ciclo.Api.Tests --logger "console;verbosity=normal"
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:Threshold=60 -p:ThresholdType=line -p:ThresholdStat=total

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
