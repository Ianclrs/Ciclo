services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ciclo
      POSTGRES_USER: ciclo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciclo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Ciclo.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=ciclo;Username=ciclo;Password=${DB_PASSWORD:-1234}
      # Segredos obrigatórios (fail-closed em Program.cs): a API não inicia sem eles.
      # Copie .env.example para .env (não versionado) e preencha os dois valores.
      - "Jwt__Secret=${JWT_SECRET:?defina JWT_SECRET no .env}"
      - "FileStorage__EncryptionKey=${ENCRYPTION_KEY:?defina ENCRYPTION_KEY no .env}"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
